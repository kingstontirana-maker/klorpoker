<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CENB · Suprem Poker</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/bots-center.css"><script type="module" src="/bots-center.js"></script><script type="module" src="/bot-simulation-panel.js"></script></head><body><header><a href="/bots"><img src="/logo.webp" alt="Suprem Poker"></a><span>CENB / KONTROLLI I BOTAVE</span><button id="logout" hidden>Dil</button></header><main><section id="login"><form id="loginForm"><label>Përdoruesi<input name="username" autocomplete="username" required></label><label>Fjalëkalimi<input name="password" type="password" autocomplete="current-password" required></label><button>Hyr në panel</button></form></section><section id="dashboard" hidden><div class="heading"><div><p class="eyebrow">CENB · PANELI I MENAXHIMIT</p><h1>Botat e platformës</h1></div><button id="refresh">Rifresko</button></div><div id="stats" class="stats"></div><section class="surface"><h2>Mbrojtja ditore</h2><p id="guardStatus"></p><form id="guardForm" class="inline"><label>Humbja maksimale ditore (€) · 0 pa kufi<input name="dailyLimit" type="number" min="0" step="0.01" required></label><button>Ruaj kufirin</button></form></section><details class="surface"><summary>Krijo një bot të ri</summary><form id="createForm" class="grid"><label>Emri<input name="name" pattern="[a-zA-Z0-9_]{3,18}" minlength="3" maxlength="18" required></label><label>Buxheti (€)<input name="budget" type="number" min="0.01" step="0.01" required></label><div id="createFields" class="fields"></div><button>Krijo botin</button><small>Buxheti zbritet nga balanca CENTER. Boti krijohet i ndalur.</small></form></details><div class="heading"><h2>Botat e regjistruar</h2><input id="search" type="search" placeholder="Kërko sipas emrit…" aria-label="Kërko bot"></div><div id="botList"></div><p id="updated" class="muted"></p></section><p id="message" role="status" aria-live="polite"></p></main><footer>SUPREM POKER · CENB</footer></body></html>
